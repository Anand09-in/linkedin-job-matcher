scraper:
  slow_mo: 1.5
  max_workers: 1
  page_load_timeout: 40
  headless: true
  default_limit: 50
  skip_promoted_jobs: true
  apply_link: true

queries:
  - query: "Machine Learning Engineer"
    locations:
      - "Bangalore, India"
      - "Mumbai, India"
      - "Pune, India"
    filters:
      relevance: RECENT
      time: MONTH
      type:
        - FULL_TIME
      # experience:
      #   - ENTRY_LEVEL
      #   - ASSOCIATE
      # on_site_or_remote:
      #   - REMOTE

database:
  path: "jobs.db"

llm:
  # Options: claude | openai | groq | ollama
  provider: "groq"
  # Claude: claude-haiku-4-5  |  claude-sonnet-4-6
  # OpenAI: gpt-4o-mini       |  gpt-4o
  # Groq:   llama-3.3-70b-versatile  (free tier)
  # Ollama: llama3.2  (local, fully free)
  model: "llama-3.3-70b-versatile"
  temperature: 0.1
  max_tokens: 2048

matching:
  # Minimum score (0-100) to include a job in results
  min_match_score: 30
  # Weight breakdown for final score
  weights:
    skills: 0.45
    experience: 0.25
    title: 0.20
    location: 0.10

features:
  cover_letter: true
  ats_scorer: true
  skill_gap: true
  company_research: true
  salary_benchmark: true
  interview_prep: true
  tracker: true
