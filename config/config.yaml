# ─────────────────────────────────────────────────────────────────────────────
# Search configuration — edit queries and filters here
# ─────────────────────────────────────────────────────────────────────────────

scraper:
  slow_mo: 1.5
  max_workers: 1
  page_load_timeout: 40
  headless: true

queries:
  - query: "AI / ML Engineer with less than 2 yrs of experience"
    locations:
      - "Bangalore, India"
      - "Mumbai, India"
      - "Pune, India"
      # - "Hyderabad, India"
      # - "Noida, India"
    limit: 30
    filters:
      relevance: RECENT
      time: WEEK
      type:
        - FULL_TIME
      experience:
        - ENTRY_LEVEL
        - ASSOCIATE

llm:
  provider: "${LLM_PROVIDER}"
  model: "${LLM_MODEL}"
  temperature: 0.1
  max_tokens: 2000

matching:
  embedding_model: "all-MiniLM-L6-v2"
  score_weights:
    semantic_similarity: 0.40
    skills_overlap: 0.35
    experience_match: 0.3
    title_match: 0.3
  min_score_threshold: 0.40
  # Jobs requiring more than this many years of experience are skipped during matching.
  # Set to null to disable. Example: 3 discards jobs needing 4+ years.
  max_experience_years: 2

features:
  cover_letter: true
  ats_score: true
  skill_gap: true
  company_research: true
  interview_prep: true
  salary_benchmark: true
