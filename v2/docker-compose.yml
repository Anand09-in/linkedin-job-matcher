services:

  # ── Postgres ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jm2_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_matcher}
    # No host port published, by design (architecture.md §2, flow-diagrams.md §3,
    # FR-9.3): only api/frontend need to be reachable from the host, and this is
    # exactly the class of problem this project hit in v1 (an unrelated Docker
    # container squatting on a host port). Uncomment below for a local DB GUI:
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jm2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jm2_redis
    # No host port published, by design — see the postgres service's comment above.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── One-off migration runner — api/worker wait for this to finish (not just
  #    for postgres to accept connections) before starting, so neither ever
  #    reads/writes against a schema that isn't there yet.
  #
  #    `image:` is pinned to the SAME tag as `api` below (both build from the
  #    same Dockerfile) so there is only ever one image for the two of them —
  #    `docker compose build api` (or `build migrate`) rebuilds both. Without
  #    this, migrate and api silently drift into two separate images that
  #    happen to share a Dockerfile, which is exactly the bug that bit this
  #    project during Phase 1 development: rebuilding `api` alone left
  #    `migrate` running a stale image that didn't have the latest migration,
  #    and `alembic upgrade head` "succeeded" against the wrong target. ───────
  migrate:
    image: v2_backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jm2_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_matcher}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    image: v2_backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jm2_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_matcher}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── arq worker ────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: jm2_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_matcher}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Vite dev server — Phase 8 adds a prod Nginx build) ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jm2_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Live source mount for Vite HMR — added in Phase 8 (before this, api/
      # worker/frontend all baked source into the image at build time, which
      # meant every one-line edit needed a full rebuild; not viable for the
      # much higher edit-and-see-it iteration rate frontend work needs).
      # The anonymous /app/node_modules volume stops the host bind (which has
      # no node_modules at all) from shadowing what npm install already put
      # in the image.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  jm2_postgres_data:
    driver: local
