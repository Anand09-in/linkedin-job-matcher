# Serves the Vite-built static bundle. `try_files ... /index.html` is the
# one thing that actually matters here: this is a client-side-routed SPA
# (react-router's createBrowserRouter), so a hard refresh on e.g. /jobs/<id>
# must still serve index.html and let the router take over, not 404 on a
# path Nginx doesn't have a real file for.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
